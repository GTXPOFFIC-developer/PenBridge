name: Release & Publish (All Platforms)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Android APK
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x Android/gradlew

      - name: Build Android APK
        working-directory: ./Android
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Package Android APK
        shell: bash
        run: |
          mkdir -p dist
          find Android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1 | \
            xargs -I {} cp {} dist/PenBridge-Android-${{ github.ref_name }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/PenBridge-Android-${{ github.ref_name }}.apk

  # ─────────────────────────────────────────────────────────────
  # 2. Windows Host — x64 + x86 .exe installers via Inno Setup
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Host (x64 + x86 Installers)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Host (x64)
        shell: pwsh
        run: |
          dotnet publish Windows/DashboardHost.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o Windows/bin/Release/net8.0-windows/win-x64/publish

      - name: Publish Windows Host (x86)
        shell: pwsh
        run: |
          dotnet publish Windows/DashboardHost.csproj `
            -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o Windows/bin/Release/net8.0-windows/win-x86/publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile x64 Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Windows/Installer/DashboardX64.iss
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item Windows/bin/Installer/DashboardX64.exe dist/PenBridge-Windows-x64-${{ github.ref_name }}.exe

      - name: Compile x86 Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Windows/Installer/DashboardX86.iss
          Move-Item Windows/bin/Installer/DashboardX86.exe dist/PenBridge-Windows-x86-${{ github.ref_name }}.exe

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/PenBridge-Windows-x64-${{ github.ref_name }}.exe

      - name: Upload Windows x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86-installer
          path: dist/PenBridge-Windows-x86-${{ github.ref_name }}.exe

  # ─────────────────────────────────────────────────────────────
  # 3. macOS Host
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS Host
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build macOS Host
        shell: bash
        run: |
          cd macOS
          dotnet publish DashboardHost.macOS.csproj -c Release -r osx-arm64 --self-contained true -o publish/arm64
          dotnet publish DashboardHost.macOS.csproj -c Release -r osx-x64  --self-contained true -o publish/x64
          mkdir -p publish/universal
          cp -r publish/arm64/* publish/universal/
          lipo -create -output publish/universal/DashboardHost.macOS \
               publish/arm64/DashboardHost.macOS publish/x64/DashboardHost.macOS || true
          cd publish && zip -r ../../DashboardHost-macOS-${{ github.ref_name }}.zip universal/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-host
          path: DashboardHost-macOS-${{ github.ref_name }}.zip

  # ─────────────────────────────────────────────────────────────
  # 4. Linux Host
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Linux Host
        shell: bash
        run: |
          dotnet publish Linux/DashboardHost.Linux.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -o publish/linux
          cp Linux/install.sh publish/linux/   || true
          cp Linux/uninstall.sh publish/linux/ || true
          chmod +x publish/linux/*.sh publish/linux/DashboardHost.Linux || true
          tar -czvf DashboardHost-Linux-${{ github.ref_name }}.tar.gz -C publish/linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-host
          path: DashboardHost-Linux-${{ github.ref_name }}.tar.gz

  # ─────────────────────────────────────────────────────────────
  # 5. iOS App
  # ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS Archive
        shell: bash
        run: |
          cd iOS
          xcodebuild build \
            -project Dashboard.xcodeproj -scheme Dashboard \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -configuration Release || \
          xcodebuild build \
            -project Dashboard.xcodeproj -scheme Dashboard \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -configuration Release || true
          mkdir -p ../dist_ios
          zip -r ../dist_ios/Dashboard-iOS-${{ github.ref_name }}.zip .

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist_ios/Dashboard-iOS-${{ github.ref_name }}.zip

  # ─────────────────────────────────────────────────────────────
  # 6. Publish All to GitHub Releases
  # ─────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-windows, build-macos, build-linux, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release_assets/

      - name: Download Windows x64 Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: release_assets/

      - name: Download Windows x86 Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-x86-installer
          path: release_assets/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-host
          path: release_assets/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-host
          path: release_assets/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PenBridge ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/PenBridge-Android-${{ github.ref_name }}.apk
            release_assets/PenBridge-Windows-x64-${{ github.ref_name }}.exe
            release_assets/PenBridge-Windows-x86-${{ github.ref_name }}.exe
            release_assets/DashboardHost-macOS-${{ github.ref_name }}.zip
            release_assets/DashboardHost-Linux-${{ github.ref_name }}.tar.gz
            release_assets/Dashboard-iOS-${{ github.ref_name }}.zip


